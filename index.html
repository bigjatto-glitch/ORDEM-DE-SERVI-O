;const amount=form.elements.quantidade||form.elements.volume;const unit=form.elements.valor||form.elements.valorExec;const total=form.elements.totalFinal;const calc=form.querySelector('#calcTotal');function recalc(){if(!amount||!unit)return;let v=Math.round((Number(amount.value)||0)*(Number(unit.value)||0)*100)/100;if(calc)calc.textContent=money(v);if(total)total.value=v.toFixed(2)}if(amount&&unit){amount.addEventListener('input',recalc);unit.addEventListener('input',recalc);if(calc)recalc()}if(form.elements.cliente&&form.elements.endereco){form.elements.cliente.addEventListener('change',()=>{let c=db.clientes.find(x=>x.id===form.elements.cliente.value);form.elements.endereco.value=enderecoCliente(c)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));save();dlg.close();render()}}function nav(){document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${x===current?'active':''}" onclick="go(${i})">${['◈','♙','◇','▣','▤','☷','◉','▥','♙','⚙'][i]} &nbsp; ${x}</button>`).join('')}function go(i){current=sections[i];render()}function head(title,sub,button='',act=''){return `<div class="top"><div><div class="eyebrow">Big Jatto / ${esc(title)}</div><h1>${esc(title)}</h1><p>${sub}</p></div>${button?`<button onclick="${act}">${button}</button>`:''}</div><div class="notice"><b>DEMONSTRAÇÃO SEM SEGURANÇA REAL.</b> Usuários, senhas e dados ficam somente neste navegador e podem ser acessados ou alterados. Não há sincronização nem backup. Use apenas dados fictícios.</div>`}function table(headers,rows){return `<div class="panel tablewrap">${rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty">Nenhum registro por enquanto.<br>Use o botão acima para começar.</div>'}</div>`}function enderecoCliente(c){if(!c)return '';if(!c.rua)return [c.endereco,c.cidade,c.cep].filter(Boolean).join(', ');return [c.rua,c.num async function buscarCep(){const form=document.getElementById('form'),cep=form.elements.cep.value.replace(/\D/g,'');if(!/^\d{8}$/.test(cep)){alert('Informe um CEP com 8 dígitos.');return}const result=document.getElementById('cepResultado');result.textContent='Consultando CEP...';try{let response=await fetch('https://viacep.com.br/ws/'+cep+'/json/');if(!response.ok)throw Error('consulta');let data=await response.json();if(!document.contains(form))return;if(data.erro){result.textContent='CEP não encontrado. Confira os dados ou preencha o endereço manualmente.';return}if(form.elements.cep.value.replace(/\D/g,'')!==cep){result.textContent='O CEP mudou durante a consulta. Consulte novamente.';return}form.elements.cep.value=data.cep||cep;for(const [dest,src] of [['rua','logradouro'],['bairro','bairro'],['cidade','localidade'],['uf','uf']])if(data[src])form.elements[dest].value=data[src];result.textContent='Endereço encontrado. Confira os dados e informe o número e complemento.'}catch(e){if(document.contains(form))result.textContent='Não foi possível consultar o CEP. Verifique sua conexão ou preencha manualmente.'}}

function addService(){if(!guardAdmin())return;modal('Novo serviço',field('Nome do serviço *','nome','text','','required')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']])+field('Valor de referência (R$)','valor','number','','step="0.01" min="0"'),v=>db.servicos.push({...v,id:id()}))}function addVehicle(){modal('Novo veículo',field('Identificação *','nome','text','','required')+field('Placa','placa')+field('Modelo','modelo')+field('Capacidade (m³)','capacidade','number','','step="0.01"'),v=>db.veiculos.push({...v,id:id()}))}function addWork(kind,source=null){if(!db.clientes.length){alert('Cadastre um cliente primeiro.');return}let s=source||{};modal(kind==='orcamentos'?'Novo orçamento':'Nova ordem de serviço',select('Cliente *','cliente',opts(db.clientes),s.cliente)+select('Serviço','servico',opts(db.servicos),s.servico)+field('Endereço do atendimento','endereco','text',s.endereco||'')+field('Data prevista / emissão','data','date',s.data||date())+field('Quantidade prevista','quantidade','number',s.quantidade||'','min="0" step="0.01"')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']],s.unidade)+field('Valor unitário (R$)','valor','number',s.valor||'','min="0" step="0.01"')+`<div style="grid-column:1/-1;background:#edf4ff;padding:12px;border-radius:8px"><b>Total calculado: <span id="calcTotal">R$ 0,00</span></b><div class="muted">Quantidade × valor unitário</div></div>`+field('Observações','obs','text',s.obs||'')+(kind==='ordens'?select('Veículo','veiculo',opts(db.veiculos))+select('Encaminhar para operador','operador',opts(db.operadores.filter(x=>x.ativo!==false))):''),v=>{if(!v.cliente){alert('Selecione um cliente.');return}db[kind].push({...v,id:id(),numero:db[kind].length+1,status:kind==='orcamentos'?'Rascunho':'Aberta',origem:source?.id||''})})}function osLabel(o){if(o.numeroOficial)return o.numeroOficial;if(o.status==='Concluída')return 'Antiga #'+(o.numero||'—'); function canPage(page){return !!sessao&&(sessao.perfil==='admin'||(sessao.perfil==='administrativo'&&!blockedAdmin.includes(page))||(sessao.perfil==='motorista'&&page==='Minhas ordens'))}
function guardAdmin(){if(sessao?.perfil==='admin')return true;alert('Esta função é exclusiva do administrador.');return false}
function validDocument(v){let n=String(v.documento||'').replace(/\D/g,'');return !n||n.length===(v.tipo==='PJ'?14:11)}
function setupForm(form){
 const amount=form.elements.quantidade||form.elements.volume,unit=form.elements.valor||form.elements.valorExec,total=form.elements.totalFinal,calc=form.querySelector('#calcTotal');
 function recalc(){if(!amount||!unit)return;let v=Math.round(num(amount.value)*num(unit.value)*100)/100;if(calc)calc.textContent=money(v);if(total)total.value=v.toFixed(2)}
 if(amount&&unit){amount.addEventListener('input',recalc);unit.addEventListener('input',recalc);if(calc)recalc()}
 const person=form.elements.tipo,doc=form.elements.documento;
 function personLabel(){if(!person||!doc)return;let label=doc.closest('label');label.firstChild.textContent=person.value==='PJ'?'CNPJ':'CPF';doc.placeholder=person.value==='PJ'?'00.000.000/0000-00':'000.000.000-00';doc.maxLength=person.value==='PJ'?18:14}
 if(person&&doc){person.addEventListener('change',personLabel);personLabel()}
 if(form.elements.cliente&&form.elements.endereco){form.elements.cliente.addEventListener('change',()=>{
  let c=db.clientes.find(x=>x.id===form.elements.cliente.value);form.elements.endereco.value=enderecoCliente(c);
  for(const key of ['nome','tipo','documento','telefone'])if(form.elements[key])form.elements[key].value=c?.[key]||(key==='tipo'?'PF':'');personLabel();
 })}
}
function modal(title,body,callback){document.getElementById('modal').innerHTML=`<h2>${esc(title)}</h2><form id="form"><div id="formError" role="alert" style="color:#a22"></div><div class="grid" style="margin-top:20px">${body}</div><div class="actions"><button type="button" class="secondary" onclick="dlg.close()">Cancelar</button><button>Salvar</button></div></form>`;dlg.showModal();let f=document.getElementById('form');setupForm(f);f.onsubmit=e=>{e.preventDefault();try{let values=Object.fromEntries(new FormData(f));if(values.tipo&&!validDocument(values)){document.getElementById('formError').textContent='Confira o documento: CPF tem 11 dígitos e CNPJ tem 14 dígitos.';return}if(callback(values)===false)return;save();dlg.close();render()}catch(err){document.getElementById('formError').textContent=err.message||'Não foi possível salvar.'}}}
function menuItems(){return sections.filter(canPage)}
function nav(){document.getElementById('nav').innerHTML=menuItems().map(x=>`<button class="${x===current?'active':''}" onclick="go(${sections.indexOf(x)})">${esc(x)}</button>`).join('')}
function go(i){if(!canPage(sections[i]))return;current=sections[i];render()}
function login(){document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML=`<div class="panel" style="max-width:450px;margin:8vh auto"><div class="eyebrow">Big Jatto • demonstração v28.10</div><h1>Entrar no aplicativo</h1><p>Administrador, Administrativo ou Motorista.</p><div class="notice"><b>Use somente dados fictícios.</b> Acesso simulado, sem segurança real. Dados e senhas ficam neste navegador e não são compartilhados entre aparelhos.</div><form id="loginform">${field('Usuário','usuario','text','','required autocomplete="username"')}${field('Senha','senha','password','','required autocomplete="current-password"')}<div id="loginError" role="alert" style="color:#a22"></div><div class="actions"><button>Entrar</button></div></form><p class="muted">Administrador de teste: admin / 1234</p></div>`;document.getElementById('loginform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.usuario==='admin'&&f.senha==='1234')sessao={perfil:'admin',nome:'Administrador'};else{let u=db.operadores.find(x=>x.usuario===f.usuario&&x.senha===f.senha&&x.ativo!==false),c=db.colaboradores.find(x=>x.id===u?.colaborador);if(!u||!c||c.ativo===false){document.getElementById('loginError').textContent='Usuário ou senha inválidos, ou acesso desativado.';return}sessao={id:u.id,perfil:u.perfil||'motorista',nome:c.nome,colaborador:c.id}}current=sessao.perfil==='motorista'?'Minhas ordens':'Painel';render()}}
function collaborator(i){if(!isManager())return;let c=i===undefined?{}:db.colaboradores[i];modal(i===undefined?'Novo colaborador':'Editar colaborador',field('Nome *','nome','text',c.nome||'','required')+field('Telefone','telefone','tel',c.telefone||'')+select('Função','funcao',[['Administrativo','Administrativo'],['Motorista','Motorista'],['Auxiliar','Auxiliar']],c.funcao||'Motorista'),v=>{if(i!==undefined&&c.funcao!==v.funcao&&(db.equipes.some(e=>e.motorista===c.id||e.auxiliar===c.id)||db.operadores.some(u=>u.colaborador===c.id))){alert('Este colaborador está vinculado a equipe ou usuário. Preserve sua função ou ajuste os vínculos primeiro.');return false}if(i===undefined)db.colaboradores.push({...v,id:id(),ativo:true});else Object.assign(c,v)})}
function team(i){if(!guardAdmin())return;let e=i===undefined?{}:db.equipes[i];const motoristas=db.colaboradores.filter(c=>c.funcao==='Motorista'),aux=db.colaboradores.filter(c=>c.funcao==='Auxiliar');if(!motoristas.length||!aux.length){alert('Cadastre pelo menos um motorista e um auxiliar em Colaboradores.');return}modal(i===undefined?'Nova equipe':'Editar equipe',field('Nome da equipe *','nome','text',e.nome||'','required')+select('Motorista *','motorista',opts(motoristas),e.motorista)+select('Auxiliar * — apenas um','auxiliar',opts(aux),e.auxiliar),v=>{if(!v.motorista||!v.auxiliar){alert('Selecione um motorista e um auxiliar.');return false}if(db.equipes.some(x=>x.id!==e.id&&(x.motorista===v.motorista||x.auxiliar===v.auxiliar))){alert('Este motorista ou auxiliar já pertence a outra equipe. Edite a equipe existente primeiro.');return false}if(i===undefined)db.equipes.push({...v,id:id()});else Object.assign(e,v)})}
function createUser(){if(!guardAdmin())return;let list=db.colaboradores.filter(c=>['Motorista','Administrativo'].includes(c.funcao));if(!list.length){alert('Cadastre um colaborador Administrativo ou Motorista primeiro.');return}modal('Novo usuário de demonstração',select('Colaborador *','colaborador',opts(list))+field('Usuário *','usuario','text','','required autocomplete="off"')+field('Senha de teste *','senha','password','','required autocomplete="new-password"')+`<p class="muted" style="grid-column:1/-1">Motorista acessa as OS de sua equipe. Administrativo acessa as funções operacionais, sem Usuários, Equipes e Serviços. Auxiliares não possuem login.</p>`,v=>{let c=db.colaboradores.find(x=>x.id===v.colaborador);if(!c){alert('Selecione o colaborador.');return false}v.usuario=v.usuario.trim();if(v.usuario.toLowerCase()==='admin'||db.operadores.some(u=>u.usuario.toLowerCase()===v.usuario.toLowerCase()||u.colaborador===c.id)){alert('Usuário ou colaborador já cadastrado.');return false}db.operadores.push({...v,id:id(),perfil:c.funcao==='Motorista'?'motorista':'administrativo',nome:c.nome,ativo:true})})}
function ativar(i){if(!guardAdmin())return;db.operadores[i].ativo=db.operadores[i].ativo===false;save();render()}
function assignTeam(o,key){let e=db.equipes.find(x=>x.id===key);if(!e)throw Error('Selecione uma equipe válida.');let m=db.colaboradores.find(x=>x.id===e.motorista),a=db.colaboradores.find(x=>x.id===e.auxiliar);if(!m||!a)throw Error('Confira os componentes da equipe.');Object.assign(o,{equipe:e.id,equipeNome:e.nome,motoristaId:m.id,motoristaNome:m.nome,auxiliarId:a.id,auxiliarNome:a.nome,operador:''})}
function crew(o){return `<div class="notice"><b>Equipe:</b> ${esc(o.equipeNome||'Não encaminhada')}<br><b>Motorista:</b> ${esc(o.motoristaNome||'Não definido')}<br><b>Auxiliar:</b> ${esc(o.auxiliarNome||'Não definido')}</div>`}
function forwarded(o){return sessao?.perfil==='motorista'&&o.motoristaId===sessao.colaborador&&o.status!=='Concluída'}
function encaminhar(i){if(!isManager())return;let o=db.ordens[i];if(o.status==='Concluída'){alert('A ordem já foi concluída.');return}if(!db.equipes.length){alert('Peça ao administrador para cadastrar uma equipe.');return}modal('Encaminhar '+osLabel(o),select('Equipe *','equipe',opts(db.equipes),o.equipe),v=>assignTeam(o,v.equipe))}
function addWork(kind,source=null){if(!isManager())return;if(!db.clientes.length){alert('Cadastre um cliente primeiro.');return}let s=source||{};modal(kind==='orcamentos'?'Novo orçamento':'Nova ordem de serviço',select('Cliente *','cliente',opts(db.clientes),s.cliente)+select('Serviço','servico',opts(db.servicos),s.servico)+field('Endereço do atendimento','endereco','text',s.endereco||enderecoCliente(db.clientes.find(x=>x.id===s.cliente)))+field('Data prevista / emissão','data','date',s.data||date())+field('Horário previsto','hora','time',s.hora||'')+field('Quantidade prevista','quantidade','number',s.quantidade||'','min="0" step="0.01"')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']],s.unidade)+field('Valor unitário (R$)','valor','number',s.valor||'','min="0" step="0.01"')+`<div style="grid-column:1/-1;background:#edf4ff;padding:12px;border-radius:8px"><b>Total: <span id="calcTotal"></span></b></div>`+field('Observações','obs','text',s.obs||'')+(kind==='ordens'?select('Veículo','veiculo',opts(db.veiculos))+select('Equipe responsável *','equipe',opts(db.equipes),s.equipe):''),v=>{if(!v.cliente){alert('Selecione um cliente.');return false}let o={...v,id:id(),numero:db[kind].length+1,status:kind==='orcamentos'?'Rascunho':'Aberta',origem:source?.id||''};if(kind==='ordens')assignTeam(o,v.equipe);db[kind].push(o)})}
function agendaForm(i){if(!isManager())return;let a=i===undefined?{}:db.agenda[i];if(a.ordemId){alert('Este pedido já gerou uma OS. Consulte a ordem vinculada.');return}modal(i===undefined?'Novo pedido na agenda':'Editar agendamento',select('Cliente cadastrado ou novo','cliente',[['','Novo cliente'],...db.clientes.map(c=>[c.id,c.nome])],a.cliente)+field('Nome / razão social *','nome','text',a.nome||'','required')+select('Pessoa','tipo',[['PF','Pessoa física — PF'],['PJ','Pessoa jurídica — PJ']],a.tipo||'PF')+field('CPF / CNPJ','documento','text',a.documento||'')+field('Telefone','telefone','tel',a.telefone||'')+field('Endereço do atendimento *','endereco','text',a.endereco||'','required')+field('Data prevista *','data','date',a.data||date(),'required')+field('Horário previsto','hora','time',a.hora||'')+select('Serviço solicitado *','servico',opts(db.servicos),a.servico)+field('Quantidade prevista','quantidade','number',a.quantidade||'','min="0" step="0.01"')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']],a.unidade||'m³')+field('Valor unitário previsto (R$)','valor','number',a.valor||'','min="0" step="0.01"')+`<div style="grid-column:1/-1"><b>Total previsto: <span id="calcTotal"></span></b></div>`+field('Observações do pedido','obs','text',a.obs||''),v=>{if(!v.servico){alert('Selecione o serviço solicitado.');return false}if(!v.cliente){let c={id:id(),nome:v.nome,tipo:v.tipo,documento:v.documento,telefone:v.telefone,endereco:v.endereco};db.clientes.push(c);v.cliente=c.id}if(i===undefined)db.agenda.push({...v,id:id(),status:'Agendado',criadoEm:date()});else Object.assign(a,v)})}
function convertAppointment(i,equipe,veiculo){let a=db.agenda[i];if(a.ordemId||db.ordens.some(o=>o.agendaId===a.id))throw Error('Este agendamento já gerou uma ordem de serviço.');let o={id:id(),numero:db.ordens.length+1,cliente:a.cliente,clienteNome:a.nome,clienteTipo:a.tipo,clienteDocumento:a.documento,clienteTelefone:a.telefone,endereco:a.endereco,data:a.data,hora:a.hora,servico:a.servico,quantidade:a.quantidade,unidade:a.unidade,valor:a.valor,obs:a.obs,veiculo,agendaId:a.id,status:'Agendada'};assignTeam(o,equipe);db.ordens.push(o);a.ordemId=o.id;a.status='OS gerada';return o}
function dispatchAppointment(i){if(!isManager())return;let a=db.agenda[i];if(a.ordemId){alert('Este pedido já foi encaminhado.');return}if(!db.equipes.length){alert('O administrador precisa cadastrar uma equipe com motorista e auxiliar.');return}modal('Gerar OS e encaminhar para equipe',`<div style="grid-column:1/-1"><p><b>${esc(a.nome)}</b><br>${esc(a.endereco)}<br>${brDate(a.data)} ${esc(a.hora)}</p></div>`+select('Equipe *','equipe',opts(db.equipes))+select('Veículo','veiculo',opts(db.veiculos)),v=>{convertAppointment(i,v.equipe,v.veiculo)})}
let agendaDate='';
function agendaPage(){let rows=db.agenda.map((a,i)=>({a,i})).filter(({a})=>!agendaDate||a.data===agendaDate).sort((x,y)=>(x.a.data+' '+(x.a.hora||'')).localeCompare(y.a.data+' '+(y.a.hora||''))).map(({a,i})=>{let o=db.ordens.find(x=>x.id===a.ordemId);return `<tr><td>${brDate(a.data)}<br>${esc(a.hora)}</td><td><b>${esc(a.nome)}</b><br>${esc(a.tipo)} ${esc(a.documento)}<br>${esc(a.telefone)}</td><td>${esc(a.endereco)}</td><td>${name('servicos',a.servico)}</td><td><span class="badge" style="background:${o?.status==='Concluída'?'#e0f4e9':'#fff3d6'};color:${o?.status==='Concluída'?'#176640':'#815b06'}">${o?.status==='Concluída'?'Concluído':'Pendente'}</span>${o?`<div class="muted" style="margin-top:8px">OS ${esc(osLabel(o))}<br>${esc(o.status)}</div>`:'<div class="muted" style="margin-top:8px">Aguardando envio à equipe</div>'}</td><td>${o?`<button class="secondary" onclick="detalhar(${db.ordens.indexOf(o)})">Ver OS</button>`:`<button class="secondary" onclick="agendaForm(${i})">Editar</button><button onclick="dispatchAppointment(${i})">Gerar OS e enviar</button>`}</td></tr>`});return head('Agenda','Histórico de todos os pedidos: pendentes e concluídos permanecem nesta lista.','+ Novo pedido','agendaForm()')+`<div class="panel"><div class="panelhead"><label>Filtrar por dia<input type="date" value="${esc(agendaDate)}" onchange="agendaDate=this.value;render()"></label><button class="secondary" onclick="agendaDate='';render()">Todos os dias</button></div></div>`+table(['Data / hora','Cliente','Endereço','Serviço','Situação do pedido','Ações'],rows)}
function detalhar(i){let o=db.ordens[i];if(!isManager()&&!forwarded(o))return;modal('Detalhes da ordem '+osLabel(o),`<div style="grid-column:1/-1">${crew(o)}<p><b>Cliente:</b> ${esc(o.clienteNome||rawName('clientes',o.cliente))}<br><b>Endereço:</b> ${esc(o.endereco)}<br><b>Previsão:</b> ${brDate(o.data)} ${esc(o.hora||'')}<br><b>Quantidade prevista:</b> ${esc(o.quantidade)} ${esc(o.unidade)}<br><b>Volume executado:</b> ${esc(o.volume??'—')} m³<br><b>Valor final:</b> ${o.totalFinal===undefined?'Não informado':money(o.totalFinal)}<br><b>Pagamento:</b> ${esc(o.forma||'Não informado')}<br><b>Pedido:</b> ${esc(o.obs||'—')}<br><b>Execução:</b> ${esc(o.execucao||'—')}</p>${mapa(o)}</div>`,()=>{})}
function executar(i){let o=db.ordens[i];if(!forwarded(o))return;modal('Execução da OS '+osLabel(o),`<div style="grid-column:1/-1">${crew(o)}<p><b>Cliente:</b> ${esc(o.clienteNome||rawName('clientes',o.cliente))}<br><b>Serviço:</b> ${name('servicos',o.servico)}<br><b>Endereço:</b> ${esc(o.endereco)}<br><b>Agendado:</b> ${brDate(o.data)} ${esc(o.hora||'')}<br><b>Observações:</b> ${esc(o.obs||'—')}</p>${mapa(o)}</div>`+field('Volume retirado (m³)','volume','number',o.volume??'','min="0" step="0.01"')+field('Valor unitário (R$ por m³)','valorExec','number',o.valorExec??o.valor??'','min="0" step="0.01"')+field('Valor final do serviço — ajustável','totalFinal','number',o.totalFinal??(num(o.quantidade)*num(o.valor)),'min="0" step="0.01"')+select('Forma de pagamento','forma',[['Não informado','Não informado'],['Pix','Pix'],['Dinheiro','Dinheiro'],['Transferência','Transferência'],['Cartão','Cartão'],['Outro','Outro']],o.forma||'Não informado')+select('Situação','status',[['Agendada','Agendada'],['Em execução','Em execução'],['Concluída','Concluída']],o.status)+field('Observações da execução','execucao','text',o.execucao||''),v=>{if(v.status==='Concluída'&&!confirm('Concluir esta ordem? Ela deixará de aparecer para o motorista.'))return false;if(v.status==='Concluída')concluirOS(o);Object.assign(o,v)})}
function render(){if(!sessao){login();return}if(sessao.perfil==='motorista'){document.getElementById('nav').innerHTML='<button class="active">Minhas ordens</button><button onclick="sair()">Sair</button>';let rows=db.ordens.map((o,i)=>({o,i})).filter(({o})=>forwarded(o)).map(({o,i})=>`<tr><td>${esc(osLabel(o))}</td><td>${brDate(o.data)} ${esc(o.hora||'')}</td><td>${esc(o.clienteNome||rawName('clientes',o.cliente))}</td><td>${esc(o.equipeNome)}<br>Motorista: ${esc(o.motoristaNome)}<br>Auxiliar: ${esc(o.auxiliarNome)}</td><td>${esc(o.endereco)}</td><td>${esc(o.status)}</td><td><button onclick="executar(${i})">Abrir OS</button></td></tr>`);document.getElementById('app').innerHTML=head('Minhas ordens','Olá, '+esc(sessao.nome)+'. Atendimentos encaminhados à sua equipe.')+table(['OS','Data / hora','Cliente','Equipe','Endereço','Situação','Ação'],rows);return}if(!canPage(current))current='Painel';let h='';if(current==='Agenda')h=agendaPage();else if(current==='Colaboradores')h=head(current,'Nome, telefone e função de cada colaborador.','+ Novo colaborador','collaborator()')+table(['Nome','Telefone','Função','Ações'],db.colaboradores.map((c,i)=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.telefone)}</td><td>${esc(c.funcao)}</td><td><button class="secondary" onclick="collaborator(${i})">Editar</button></td></tr>`));else if(current==='Equipes')h=head(current,'Cada equipe tem exatamente um motorista e um auxiliar.','+ Nova equipe','team()')+table(['Equipe','Motorista','Auxiliar','Ação'],db.equipes.map((e,i)=>`<tr><td>${esc(e.nome)}</td><td>${name('colaboradores',e.motorista)}</td><td>${name('colaboradores',e.auxiliar)}</td><td><button class="secondary" onclick="team(${i})">Editar</button></td></tr>`));else if(current==='Usuários')h=head(current,'Acessos de Administrativo e Motorista vinculados aos colaboradores.','+ Novo usuário','createUser()')+table(['Nome','Usuário','Perfil','Equipe','Situação','Ação'],db.operadores.map((u,i)=>{let e=db.equipes.find(x=>x.motorista===u.colaborador
