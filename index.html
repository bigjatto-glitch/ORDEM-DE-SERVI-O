const sections=['Painel','Clientes','Serviços','Veículos','Orçamentos','Ordens de serviço','Pagamentos e recibos','Relatórios','Usuários','Configurações'];let current='Painel';let db=JSON.parse(localStorage.getItem('bj-demo-v1')||'null')||{clientes:[],servicos:[{nome:'Limpeza de fossa séptica',unidade:'m³'},{nome:'Esgotamento de fossa',unidade:'m³'},{nome:'Limpeza de caixa de gordura',unidade:'serviço'}],veiculos:[],orcamentos:[],ordens:[],pagamentos:[],empresa:{nome:'Big Jatto — Soluções Rápidas'}};db.operadores ||= []; db.servicos.forEach((x,i)=>{if(!x.id)x.id='servico-'+i}); let sessao=null; const save=()=>localStorage.setItem('bj-demo-v1',JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=n=>Number(n||0);const date=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);const name=(list,id)=>esc((db[list].find(x=>x.id===id)||{}).nome||'—');const field=(label,key,type='text',val='',extra='')=>`<label>${label}<input name="${key}" type="${type}" value="${esc(val)}" ${extra}></label>`;const select=(label,key,opts,val='')=>`<label>${label}<select name="${key}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;const opts=(arr)=>[['','Selecione'],...arr.map(x=>[x.id,x.nome])];function modal(title,body,callback){document.getElementById('modal').innerHTML=`<h2>${title}</h2><form id="form"><div class="grid" style="margin-top:20px">${body}</div><div class="actions"><button type="button" class="secondary" onclick="dlg.close()">Cancelar</button><button>Salvar</button></div></form>`;dlg.showModal();const form=document.getElementById('form');const amount=form.elements.quantidade||form.elements.volume;const unit=form.elements.valor||form.elements.valorExec;const total=form.elements.totalFinal;const calc=form.querySelector('#calcTotal');function recalc(){if(!amount||!unit)return;let v=Math.round((Number(amount.value)||0)*(Number(unit.value)||0)*100)/100;if(calc)calc.textContent=money(v);if(total)total.value=v.toFixed(2)}if(amount&&unit){amount.addEventListener('input',recalc);unit.addEventListener('input',recalc);if(calc)recalc()}document.getElementById('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));save();dlg.close();render()}}function nav(){document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${x===current?'active':''}" onclick="go(${i})">${['◈','♙','◇','▣','▤','☷','◉','▥','♙','⚙'][i]} &nbsp; ${x}</button>`).join('')}function go(i){current=sections[i];render()}function head(title,sub,button='',act=''){return `<div class="top"><div><div class="eyebrow">Big Jatto / ${esc(title)}</div><h1>${esc(title)}</h1><p>${sub}</p></div>${button?`<button onclick="${act}">${button}</button>`:''}</div><div class="notice"><b>DEMONSTRAÇÃO SEM SEGURANÇA REAL.</b> Usuários, senhas e dados ficam somente neste navegador e podem ser acessados ou alterados. Não há sincronização nem backup. Use apenas dados fictícios.</div>`}function table(headers,rows){return `<div class="panel tablewrap">${rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty">Nenhum registro por enquanto.<br>Use o botão acima para começar.</div>'}</div>`}function addClient(){modal('Novo cliente',field('Nome ou razão social *','nome','text','','required')+field('CPF ou CNPJ','documento')+field('Telefone / WhatsApp','telefone')+field('E-mail','email','email')+field('Endereço de atendimento','endereco')+field('Cidade / bairro','cidade'),v=>db.clientes.push({...v,id:id()}))}function addService(){modal('Novo serviço',field('Nome do serviço *','nome','text','','required')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']])+field('Valor de referência (R$)','valor','number','','step="0.01" min="0"'),v=>db.servicos.push({...v,id:id()}))}function addVehicle(){modal('Novo veículo',field('Identificação *','nome','text','','required')+field('Placa','placa')+field('Modelo','modelo')+field('Capacidade (m³)','capacidade','number','','step="0.01"'),v=>db.veiculos.push({...v,id:id()}))}function addWork(kind,source=null){if(!db.clientes.length){alert('Cadastre um cliente primeiro.');return}let s=source||{};modal(kind==='orcamentos'?'Novo orçamento':'Nova ordem de serviço',select('Cliente *','cliente',opts(db.clientes),s.cliente)+select('Serviço','servico',opts(db.servicos),s.servico)+field('Endereço do atendimento','endereco','text',s.endereco||'')+field('Data prevista / emissão','data','date',s.data||date())+field('Quantidade prevista','quantidade','number',s.quantidade||'','min="0" step="0.01"')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']],s.unidade)+field('Valor unitário (R$)','valor','number',s.valor||'','min="0" step="0.01"')+`<div style="grid-column:1/-1;background:#edf4ff;padding:12px;border-radius:8px"><b>Total calculado: <span id="calcTotal">R$ 0,00</span></b><div class="muted">Quantidade × valor unitário</div></div>`+field('Observações','obs','text',s.obs||'')+(kind==='ordens'?select('Veículo','veiculo',opts(db.veiculos))+select('Encaminhar para operador','operador',opts(db.operadores.filter(x=>x.ativo!==false))):''),v=>{if(!v.cliente){alert('Selecione um cliente.');return}db[kind].push({...v,id:id(),numero:db[kind].length+1,status:kind==='orcamentos'?'Rascunho':'Aberta',origem:source?.id||''})})}function osLabel(o){if(o.numeroOficial)return o.numeroOficial;if(o.status==='Concluída')return 'Antiga #'+(o.numero||'—');return 'Provisória #'+(o.numero||'—')}function concluirOS(o){if(!o.numeroOficial){const ano=date().slice(0,4);let maior=db.ordens.reduce((max,x)=>{let m=/^(\d+)\/(\d{4})$/.exec(x.numeroOficial||'');return m&&m[2]===ano?Math.max(max,Number(m[1])):max},0);o.numeroOficial=String(maior+1).padStart(2,'0')+'/'+ano}if(!o.concluidaEm)o.concluidaEm=date()}function statusChange(k,i){let a=db[k][i], choices=k==='orcamentos'?['Rascunho','Enviado','Aprovado','Recusado','Vencido','Cancelado']:['Aberta','Agendada','Em execução','Concluída','Cancelada','Não executada'];modal('Atualizar situação',select('Situação','status',choices.map(x=>[x,x]),a.status)+field('Volume executado (m³)','volume','number',a.volume||'','min="0" step="0.01"')+field('Observações da execução','execucao','text',a.execucao||''),v=>{if(k==='ordens'&&v.status==='Concluída'&&a.status!=='Concluída')concluirOS(a);Object.assign(a,v)})}function convert(i){let o=db.orcamentos[i];if(o.status!=='Aprovado'){alert('Marque o orçamento como aprovado primeiro.');return}addWork('ordens',o)}function payment(){if(!db.ordens.length){alert('Cadastre uma ordem de serviço primeiro.');return}modal('Registrar pagamento',select('Ordem de serviço','ordem',[['','Selecione'],...db.ordens.map(x=>[x.id,`OS ${osLabel(x)} — ${name('clientes',x.cliente)}`])])+field('Valor recebido (R$) *','valor','number','','required min="0.01" step="0.01"')+field('Data','data','date',date())+select('Forma de pagamento','forma',[['Pix','Pix'],['Dinheiro','Dinheiro'],['Transferência','Transferência'],['Cartão','Cartão'],['Outro','Outro']]),v=>{if(!v.ordem){alert('Selecione uma ordem.');return}db.pagamentos.push({...v,id:id(),numero:db.pagamentos.length+1})})}function renderOriginal(){nav();let h='';if(current==='Painel'){let total=db.pagamentos.reduce((a,p)=>a+num(p.valor),0),pending=db.ordens.reduce((a,o)=>a+Math.max(0,num(o.totalFinal!==undefined?o.totalFinal:num(o.quantidade)*num(o.valor))-db.pagamentos.filter(p=>p.ordem===o.id).reduce((s,p)=>s+num(p.valor),0)),0);h=head('Visão geral','Acompanhe seus atendimentos em um só lugar.','+ Nova ordem',"addWork('ordens')")+`<div class="cards">${[['Ordens em aberto',db.ordens.filter(x=>!['Concluída','Cancelada','Não executada'].includes(x.status)).length],['Orçamentos',db.orcamentos.length],['Recebido',money(total)],['Saldo estimado',money(pending)]].map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong><span>Todos os registros</span></div>`).join('')}</div><div class="panel"><div class="panelhead"><div><h2>Comece por aqui</h2><p>Organize o próximo atendimento da sua empresa.</p></div></div><div class="feature"><span class="icon">01</span><div><b>Cadastre seus clientes</b><div class="muted">Reúna contatos e endereços em um lugar.</div></div></div><div class="feature"><span class="icon">02</span><div><b>Prepare um orçamento</b><div class="muted">Informe o serviço, a quantidade e o preço.</div></div></div><div class="feature"><span class="icon">03</span><div><b>Registre a execução</b><div class="muted">Acompanhe a ordem e registre o recebimento.</div></div></div></div>`}
else if(current==='Clientes')h=head(current,'Seus contatos e locais de atendimento.','+ Novo cliente','addClient()')+table(['Cliente','CPF / CNPJ','Telefone','Endereço'],db.clientes.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.documento)}</td><td>${esc(x.telefone)}</td><td>${esc(x.endereco)} ${esc(x.cidade)}</td></tr>`));else if(current==='Serviços')h=head(current,'Tipos de serviços e unidades de cobrança.','+ Novo serviço','addService()')+table(['Serviço','Unidade','Valor de referência'],db.servicos.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.unidade)}</td><td>${x.valor?money(x.valor):'—'}</td></tr>`));else if(current==='Veículos')h=head(current,'Veículos utilizados nos atendimentos.','+ Novo veículo','addVehicle()')+table(['Identificação','Placa','Modelo','Capacidade'],db.veiculos.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.placa)}</td><td>${esc(x.modelo)}</td><td>${esc(x.capacidade)} m³</td></tr>`));else if(['Orçamentos','Ordens de serviço'].includes(current)){let k=current==='Orçamentos'?'orcamentos':'ordens';h=head(current,'Acompanhe e atualize seus atendimentos.',k==='ordens'?'+ Nova ordem':'+ Novo orçamento',`addWork('${k}')`)+table(['Número','Cliente','Serviço','Data','Valor previsto','Situação','Ações'],db[k].map((x,i)=>`<tr><td>${k==='ordens'?esc(osLabel(x)):'#'+esc(x.numero)}</td><td>${name('clientes',x.cliente)}</td><td>${name('servicos',x.servico)}</td><td>${esc(x.data)}</td><td>${money(x.totalFinal!==undefined?x.totalFinal:num(x.quantidade)*num(x.valor))}</td><td><span class="badge">${esc(x.status)}</span></td><td><button class="secondary" onclick="statusChange('${k}',${i})">Atualizar</button>${k==='ordens'?`<button class="secondary" onclick="encaminhar(${i})">Encaminhar</button><button class="secondary" onclick="detalhar(${i})">Detalhes</button>`:''}${k==='orcamentos'?`<button class="secondary" onclick="convert(${i})">Gerar OS</button><button class="secondary" onclick="quotePDF(${i})">Ver PDF</button>`:''}</td></tr>`))}else if(current==='Pagamentos e recibos')h=head(current,'Registre recebimentos e imprima recibos.','+ Pagamento','payment()')+table(['Recibo','Ordem','Data','Forma','Valor','Ação'],db.pagamentos.map((x,i)=>`<tr><td>#${x.numero}</td><td>OS ${esc(osLabel(db.ordens.find(o=>o.id===x.ordem)||{}))}</td><td>${esc(x.data)}</td><td>${esc(x.forma)}</td><td>${money(x.valor)}</td><td><button class="secondary" onclick="receipt(${i})">Ver recibo em PDF</button></td></tr>`));else if(current==='Relatórios')h=head(current,'Relatórios e acompanhamento de vendas.')+salesPanel();else if(current==='Usuários')h=head(current,'Acesso da equipe e permissões.')+'<div class="panel"><h2>Recurso em desenvolvimento</h2><p>O cadastro de usuários, as senhas e as permissões por perfil ainda não estão disponíveis nesta demonstração.</p></div>';else h=head(current,'Informações da sua empresa.','Editar dados','company()')+`<div class="panel"><h2>${esc(db.empresa.nome)}</h2><p>CNPJ: ${esc(db.empresa.cnpj||'Não informado')}<br>Telefone: ${esc(db.empresa.telefone||'Não informado')}<br>Endereço: ${esc(db.empresa.endereco||'Não informado')}</p></div>`;document.getElementById('app').innerHTML=h}function company(){let e=db.empresa;modal('Dados da empresa',field('Nome','nome','text',e.nome)+field('CNPJ','cnpj','text',e.cnpj||'')+field('Telefone','telefone','text',e.telefone||'')+field('Endereço','endereco','text',e.endereco||''),v=>db.empresa=v)}
function login(){document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML=`<div class="panel" style="max-width:440px;margin:8vh auto"><div class="eyebrow">Big Jatto • demonstração</div><h1>Entrar no aplicativo</h1><p>Use os dados de demonstração para conhecer os perfis.</p><div class="notice"><b>Não use informações reais.</b> Esta tela simula o acesso e não protege dados nem senhas. Os registros existem apenas neste navegador.</div><form id="loginform">${field('Usuário','usuario','text','','required autocomplete="username"')}${field('Senha','senha','password','','required autocomplete="current-password"')}<div style="margin-top:18px"><button>Entrar</button></div></form><p class="muted">Administrador de teste: admin / 1234</p></div>`;document.getElementById('loginform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(f.usuario==='admin'&&f.senha==='1234')sessao={perfil:'admin',nome:'Administrador'};else {let op=db.operadores.find(x=>x.usuario===f.usuario&&x.senha===f.senha&&x.ativo!==false);if(!op){alert('Usuário ou senha inválidos, ou acesso desativado.');return}sessao={perfil:'operador',id:op.id,nome:op.nome}}current=sessao.perfil==='admin'?'Painel':'Minhas ordens';render()}}function sair(){sessao=null;login()}

function mapa(o){let c=db.clientes.find(x=>x.id===o.cliente)||{};let end=[o.endereco||c.endereco,c.cidade].filter(Boolean).join(', ').trim();if(!end)return '<span class="muted">Endereço não informado.</span>';let q=encodeURIComponent(end);return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px"><a class="btn" style="text-decoration:none" href="https://www.google.com/maps/search/?api=1&amp;query=${q}" target="_blank" rel="noopener noreferrer">Google Maps ↗</a><a class="btn" style="text-decoration:none;background:#168dc1" href="https://waze.com/ul?q=${q}&amp;navigate=yes" target="_blank" rel="noopener noreferrer">Waze ↗</a></div>`}function detalhar(i){let o=db.ordens[i];modal('Detalhes da ordem '+osLabel(o),`<div style="grid-column:1/-1"><p><b>Cliente:</b> ${name('clientes',o.cliente)}<br><b>Operador:</b> ${name('operadores',o.operador)}<br><b>Endereço:</b> ${esc(o.endereco)}<br><b>Quantidade prevista:</b> ${esc(o.quantidade)} ${esc(o.unidade)}<br><b>Volume executado:</b> ${esc(o.volume||'—')} m³<br><b>Valor previsto:</b> ${money(num(o.quantidade)*num(o.valor))}<br><b>Valor final:</b> ${o.totalFinal===undefined?'Não informado':money(o.totalFinal)}<br><b>Forma de pagamento:</b> ${esc(o.forma||'Não informada')}<br><b>Observações:</b> ${esc(o.execucao||'—')}</p>${mapa(o)}</div>`,()=>{})}
function executar(i){let o=db.ordens[i];if(!o||o.operador!==sessao.id||o.status==='Concluída')return;modal('Execução da OS '+osLabel(o),`<div style="grid-column:1/-1"><p><b>Cliente:</b> ${name('clientes',o.cliente)}<br><b>Serviço:</b> ${name('servicos',o.servico)}<br><b>Endereço:</b> ${esc(o.endereco)}<br><b>Previsão:</b> ${esc(o.quantidade)} ${esc(o.unidade)} — ${money(num(o.quantidade)*num(o.valor))}</p>${mapa(o)}</div>`+field('Volume retirado (m³)','volume','number',o.volume||'','min="0" step="0.01"')+field('Valor unitário (R$ por m³)','valorExec','number',o.valorExec??o.valor??'','min="0" step="0.01"')+field('Valor final do serviço (R$) — ajustável','totalFinal','number',o.totalFinal??(num(o.quantidade)*num(o.valor)),'min="0" step="0.01"')+select('Forma de pagamento','forma',[['Não informado','Não informado'],['Pix','Pix'],['Dinheiro','Dinheiro'],['Transferência','Transferência'],['Cartão','Cartão'],['Outro','Outro']],o.forma||'Não informado')+select('Situação','status',[['Aberta','Aberta'],['Agendada','Agendada'],['Em execução','Em execução'],['Concluída','Concluída']],o.status)+field('Observações','execucao','text',o.execucao||''),v=>{if(v.status==='Concluída'&&!confirm('Concluir esta ordem? Ela deixará de aparecer para o operador.'))return;if(v.status==='Concluída'&&o.status!=='Concluída')concluirOS(o);Object.assign(o,v)})}
function render(){if(!sessao){login();return}if(sessao.perfil==='operador'){document.getElementById('nav').innerHTML=`<button class="active">☷ &nbsp; Minhas ordens</button><button onclick="sair()">↪ &nbsp; Sair</button>`;let rows=db.ordens.map((o,i)=>({o,i})).filter(({o})=>o.operador===sessao.id&&o.status!=='Concluída').map(({o,i})=>`<tr><td>${esc(osLabel(o))}</td><td>${name('clientes',o.cliente)}</td><td>${name('servicos',o.servico)}</td><td>${esc(o.endereco)}</td><td><span class="badge">${esc(o.status)}</span></td><td><button onclick="executar(${i})">Abrir OS</button></td></tr>`);document.getElementById('app').innerHTML=head('Minhas ordens','Olá, '+esc(sessao.nome)+'. Consulte os atendimentos encaminhados a você.')+table(['OS','Cliente','Serviço','Endereço','Situação','Ação'],rows);return}if(current==='Usuários'){nav();document.getElementById('app').innerHTML=head('Usuários','Cadastre operadores para testar o fluxo.','+ Novo operador','criarOperador()')+table(['Operador','Usuário','Telefone','Situação','Ações'],db.operadores.map((x,i)=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.usuario)}</td><td>${esc(x.telefone)}</td><td>${x.ativo===false?'Inativo':'Ativo'}</td><td><button class="secondary" onclick="ativar(${i})">${x.ativo===false?'Ativar':'Desativar'}</button></td></tr>`));}else renderOriginal();document.getElementById('nav').insertAdjacentHTML('beforeend','<button onclick="sair()">↪ &nbsp; Sair</button>')}

function rawName(list,key){return (db[list].find(x=>x.id===key)||{}).nome||'—'}
function brDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')?d.split('-').reverse().join('/'):d||'—'}
function pdfHex(s){const special={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};return Array.from(String(s)).map(c=>{let n=c.charCodeAt(0);return (n<256?n:(special[c]||63)).toString(16).padStart(2,'0')}).join('').toUpperCase()}
function wrap(s,limit=88){let str=String(s||' '),out=[];while(str.length>limit){let cut=str.lastIndexOf(' ',limit);if(cut<20)cut=limit;out.push(str.slice(0,cut));str=str.slice(cut).trimStart()}out.push(str);return out}
function makePDF(title,lines){let all=[...wrap(db.empresa.nome||'Big Jatto — Soluções Rápidas'),...(db.empresa.cnpj?['CNPJ: '+db.empresa.cnpj]:[]),...(db.empresa.telefone?['Telefone: '+db.empresa.telefone]:[]),'',title,'',...lines.flatMap(x=>wrap(x))];let pages=[];for(let i=0;i<all.length;i+=47)pages.push(all.slice(i,i+47));let objs=[];const add=s=>{objs.push(s);return objs.length};add('<< /Type /Catalog /Pages 2 0 R >>');add('');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');let ids=[];for(const page of pages){let content='BT /F1 11 Tf 48 797 Td 15 TL '+page.map((x,i)=>(i?'T* ':'')+'<'+pdfHex(x)+'> Tj').join(' ')+' ET';let contentId=add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');ids.push(add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents '+contentId+' 0 R >>'))}objs[1]='<< /Type /Pages /Kids ['+ids.map(x=>x+' 0 R').join(' ')+'] /Count '+ids.length+' >>';let pdf='%PDF-1.4\n',offsets=[0];objs.forEach((o,i)=>{offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});let xref=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';return new Blob([pdf],{type:'application/pdf'})}
function showPDF(title,lines,filename){let url=URL.createObjectURL(makePDF(title,lines));let old=document.getElementById('pdfdialog');if(old)old.remove();let d=document.createElement('dialog');d.id='pdfdialog';d.style.width='min(900px,96vw)';d.innerHTML=`<div class="modal"><div class="panelhead"><h2>${esc(title)}</h2><button class="secondary" onclick="document.getElementById('pdfdialog').close()">Fechar</button></div><p class="muted">Visualize o documento ou faça o download.</p><iframe title="Visualização do PDF" style="width:100%;height:65vh;border:1px solid #d9e1ef" src="${url}"></iframe><div class="actions"><a class="btn" style="text-decoration:none" href="${url}" download="${esc(filename)}">Baixar PDF</a><a class="btn" style="text-decoration:none" href="${url}" target="_blank" rel="noopener">Abrir em nova aba</a></div></div>`;document.body.appendChild(d);d.addEventListener('close',()=>{URL.revokeObjectURL(url);d.remove()});d.showModal()}
function quotePDF(i){let o=db.orcamentos[i],c=db.clientes.find(x=>x.id===o.cliente)||{};showPDF('ORÇAMENTO Nº '+o.numero,['Data: '+brDate(o.data),'Cliente: '+(c.nome||'—'),'CPF/CNPJ: '+(c.documento||'—'),'Telefone: '+(c.telefone||'—'),'Endereço: '+(o.endereco||c.endereco||'—'),'','Serviço: '+rawName('servicos',o.servico),'Quantidade: '+(o.quantidade||'0')+' '+(o.unidade||''),'Valor unitário: '+money(o.valor),'VALOR TOTAL: '+money(num(o.quantidade)*num(o.valor)),'Situação: '+o.status,'Observações: '+(o.obs||'—')],'orcamento-'+o.numero+'.pdf')}
function receipt(i){let p=db.pagamentos[i],o=db.ordens.find(x=>x.id===p.ordem)||{},c=db.clientes.find(x=>x.id===o.cliente)||{};showPDF('RECIBO Nº '+p.numero,['Recebemos de: '+(c.nome||'—'),'CPF/CNPJ: '+(c.documento||'—'),'Valor recebido: '+money(p.valor),'Data do pagamento: '+brDate(p.data),'Forma de pagamento: '+p.forma,'Referente à ordem de serviço: '+osLabel(o),'Serviço: '+rawName('servicos',o.servico),'','________________________________________','Responsável pelo recebimento','','Este recibo não substitui nota fiscal.'],'recibo-'+p.numero+'.pdf')}
function salesData(){let start=document.getElementById('vendasInicio')?.value||'',end=document.getElementById('vendasFim')?.value||'';return db.ordens.filter(o=>{let d=o.concluidaEm||o.data||'';return o.status==='Concluída'&&(!start||d>=start)&&(!end||d<=end)}).map(o=>{let pagamentos=db.pagamentos.filter(p=>p.ordem===o.id).reduce((a,p)=>a+num(p.valor),0);return [osLabel(o),brDate(o.concluidaEm||o.data),rawName('clientes',o.cliente),rawName('servicos',o.servico),o.volume||'',num(o.totalFinal!==undefined?o.totalFinal:num(o.quantidade)*num(o.valor)),pagamentos,Math.max(0,num(o.totalFinal!==undefined?o.totalFinal:num(o.quantidade)*num(o.valor))-pagamentos)]})}
function salesPDF(){let rows=salesData(),sum=(i)=>rows.reduce((a,r)=>a+num(r[i]),0);showPDF('RELATÓRIO DE VENDAS', ['Período: '+brDate(document.getElementById('vendasInicio').value)+' até '+brDate(document.getElementById('vendasFim').value),'Ordens concluídas: '+rows.length,'Total de vendas: '+money(sum(5)),'Recebido nessas ordens: '+money(sum(6)),'Saldo pendente: '+money(sum(7)),'',...rows.flatMap(r=>['OS '+r[0]+' | Data: '+r[1]+' | Cliente: '+r[2], 'Serviço: '+r[3]+' | Volume: '+(r[4]||'—')+' m³','Venda: '+money(r[5])+' | Recebido: '+money(r[6])+' | Saldo: '+money(r[7]),'']),...(rows.length?[]:['Nenhuma ordem concluída no período.']),'Data: conclusão; para ordens antigas sem data de conclusão, usa-se a data cadastrada na OS.','Os recebimentos são os pagamentos vinculados às ordens selecionadas, independentemente da data de pagamento.'],'relatorio-vendas.pdf')}
function xml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'')}
function zipFiles(files){let enc=new TextEncoder(),parts=[],cent=[],offset=0;function little(n,l){let b=new Uint8Array(l);for(let i=0;i<l;i++)b[i]=(n>>>(8*i))&255;return b}function cat(...a){let o=new Uint8Array(a.reduce((s,x)=>s+x.length,0)),p=0;for(let x of a){o.set(x,p);p+=x.length}return o}function crc32(buf){let c=0xffffffff;for(let b of buf){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}for(let [name,data] of files){let n=enc.encode(name),b=enc.encode(data),crc=crc32(b);let local=cat(little(0x04034b50,4),little(20,2),little(0,2),little(0,2),little(0,2),little(0,2),little(crc,4),little(b.length,4),little(b.length,4),little(n.length,2),little(0,2),n,b);let central=cat(little(0x02014b50,4),little(20,2),little(20,2),little(0,2),little(0,2),little(0,2),little(0,2),little(crc,4),little(b.length,4),little(b.length,4),little(n.length,2),little(0,2),little(0,2),little(0,2),little(0,2),little(0,4),little(offset,4),n);parts.push(local);cent.push(central);offset+=local.length}let cd=cat(...cent),end=cat(little(0x06054b50,4),little(0,2),little(0,2),little(files.length,2),little(files.length,2),little(cd.length,4),little(offset,4),little(0,2));return new Blob([...parts,cd,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function salesExcel(){let data=[['OS','Data','Cliente','Serviço','Volume (m³)','Venda (R$)','Recebido (R$)','Saldo (R$)'],...salesData()];let sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+data.map((row,i)=>'<row r="'+(i+1)+'">'+row.map((v,j)=>{let cell=String.fromCharCode(65+j)+(i+1);return typeof v==='number'?'<c r="'+cell+'"><v>'+v+'</v></c>':'<c r="'+cell+'" t="inlineStr"><is><t xml:space="preserve">'+xml(v)+'</t></is></c>'}).join('')+'</row>').join('')+'</sheetData></worksheet>';let blob=zipFiles([['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Vendas" sheetId="1" r:id="rId1"/></sheets></workbook>'],['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'],['xl/worksheets/sheet1.xml',sheet]]);let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='relatorio-vendas.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function salesPanel(){return `<div class="panel"><h2>Relatório de vendas</h2><p>Ordens concluídas, filtradas pela data de conclusão. Ordens antigas sem essa data usam a data cadastrada na OS.</p><div class="grid"><label>De <input type="date" id="vendasInicio"></label><label>Até <input type="date" id="vendasFim"></label></div><p>Os recebimentos incluem todos os pagamentos das ordens selecionadas, mesmo que tenham ocorrido em outro período.</p><div class="actions" style="justify-content:flex-start"><button onclick="salesPDF()">Ver PDF</button><button class="secondary" onclick="salesExcel()">Baixar Excel</button></div></div>`}
