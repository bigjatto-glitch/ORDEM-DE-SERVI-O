<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big Jatto • Gestão</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#172545;font:15px system-ui}aside{position:fixed;width:240px;background:#172e82;color:white;height:100vh;padding:22px 14px;overflow:auto}aside img{width:100%;height:92px;object-fit:cover;object-position:center;border-radius:8px}aside small{display:block;color:#b7c8fa;margin:20px 12px 10px;font-weight:700;letter-spacing:.12em}nav button{background:none;border:0;color:#d5e1ff;text-align:left;width:100%;padding:12px;border-radius:9px;cursor:pointer;font-size:14px}nav button.active,nav button:hover{background:#334ca4;color:white}main{margin-left:240px;padding:30px 38px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{color:#3985ba;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:30px;margin:6px 0}h2{font-size:19px;margin:0}p{color:#697690}button,.btn{border:0;border-radius:9px;padding:11px 16px;background:#253f99;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e9eef9;color:#263d85}button.danger{background:#fff0f0;color:#a33}.notice{background:#eaf4ff;border:1px solid #cde4fa;color:#315375;padding:13px 16px;border-radius:10px;margin:22px 0;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.card,.panel{background:white;border:1px solid #e3e9f3;border-radius:14px;box-shadow:0 3px 14px #24355a08}.card{padding:20px}.card span{color:#6d7990;font-size:13px}.card strong{display:block;font-size:27px;margin:10px 0 4px}.panel{padding:22px;margin-top:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#7c899e;font-size:13px}.empty{padding:38px;text-align:center;color:#8894a8}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:13px 9px;border-bottom:1px solid #edf0f6;font-size:13px}th{color:#78859a;font-size:11px;text-transform:uppercase}td button{padding:6px 9px;font-size:12px;margin:2px}.badge{background:#edf4ff;color:#3156a3;padding:5px 9px;border-radius:20px;white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#51617b;font-size:13px;font-weight:600}input,select,textarea{width:100%;padding:11px;border:1px solid #d9e1ef;border-radius:8px;margin-top:6px;font:inherit;color:#26364f;background:white}dialog{border:0;border-radius:15px;padding:0;width:min(650px,94vw);box-shadow:0 20px 70px #0004}dialog::backdrop{background:#102044aa}.modal{padding:25px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.search{max-width:300px;margin:0}.feature{display:flex;gap:12px;align-items:center;padding:15px;border-bottom:1px solid #edf0f6}.icon{background:#e9f3ff;border-radius:10px;padding:10px;color:#287bb8}@media(max-width:750px){aside{position:static;width:100%;height:auto;padding:12px}aside img{width:155px;height:55px}aside small{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{margin:0;padding:22px 16px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tablewrap{overflow:auto}.top{align-items:flex-start}h1{font-size:24px}}@media print{aside,.top button,.notice,.actions,nav{display:none}main{margin:0}body{background:white}}
</style></head><body><aside><img src="logo.jpeg" alt="Big Jatto Soluções Rápidas"><small>GESTÃO DE SERVIÇOS</small><nav id="nav"></nav><small>BIG JATTO • DEMONSTRAÇÃO</small></aside><main><div id="app"></div></main><dialog id="dlg"><div class="modal" id="modal"></div></dialog><script>
const sections=['Painel','Clientes','Serviços','Veículos','Orçamentos','Ordens de serviço','Pagamentos e recibos','Relatórios','Usuários','Configurações'];let current='Painel';let db=JSON.parse(localStorage.getItem('bj-demo-v1')||'null')||{clientes:[],servicos:[{nome:'Limpeza de fossa séptica',unidade:'m³'},{nome:'Esgotamento de fossa',unidade:'m³'},{nome:'Limpeza de caixa de gordura',unidade:'serviço'}],veiculos:[],orcamentos:[],ordens:[],pagamentos:[],empresa:{nome:'Big Jatto — Soluções Rápidas'}};const save=()=>localStorage.setItem('bj-demo-v1',JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=n=>Number(n||0);const date=()=>new Date().toISOString().slice(0,10);const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);const name=(list,id)=>esc((db[list].find(x=>x.id===id)||{}).nome||'—');const field=(label,key,type='text',val='',extra='')=>`<label>${label}<input name="${key}" type="${type}" value="${esc(val)}" ${extra}></label>`;const select=(label,key,opts,val='')=>`<label>${label}<select name="${key}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;const opts=(arr)=>[['','Selecione'],...arr.map(x=>[x.id,x.nome])];function modal(title,body,callback){document.getElementById('modal').innerHTML=`<h2>${title}</h2><form id="form"><div class="grid" style="margin-top:20px">${body}</div><div class="actions"><button type="button" class="secondary" onclick="dlg.close()">Cancelar</button><button>Salvar</button></div></form>`;dlg.showModal();document.getElementById('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));save();dlg.close();render()}}function nav(){document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${x===current?'active':''}" onclick="go(${i})">${['◈','♙','◇','▣','▤','☷','◉','▥','♙','⚙'][i]} &nbsp; ${x}</button>`).join('')}function go(i){current=sections[i];render()}function head(title,sub,button='',act=''){return `<div class="top"><div><div class="eyebrow">Big Jatto / ${esc(title)}</div><h1>${esc(title)}</h1><p>${sub}</p></div>${button?`<button onclick="${act}">${button}</button>`:''}</div><div class="notice"><b>Versão de demonstração.</b> Os dados ficam somente neste navegador e dispositivo. Não há login individual, sincronização entre aparelhos nem backup automático. Evite inserir dados pessoais reais nesta etapa.</div>`}function table(headers,rows){return `<div class="panel tablewrap">${rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty">Nenhum registro por enquanto.<br>Use o botão acima para começar.</div>'}</div>`}function addClient(){modal('Novo cliente',field('Nome ou razão social *','nome','text','','required')+field('CPF ou CNPJ','documento')+field('Telefone / WhatsApp','telefone')+field('E-mail','email','email')+field('Endereço de atendimento','endereco')+field('Cidade / bairro','cidade'),v=>db.clientes.push({...v,id:id()}))}function addService(){modal('Novo serviço',field('Nome do serviço *','nome','text','','required')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']])+field('Valor de referência (R$)','valor','number','','step="0.01" min="0"'),v=>db.servicos.push({...v,id:id()}))}function addVehicle(){modal('Novo veículo',field('Identificação *','nome','text','','required')+field('Placa','placa')+field('Modelo','modelo')+field('Capacidade (m³)','capacidade','number','','step="0.01"'),v=>db.veiculos.push({...v,id:id()}))}function addWork(kind,source=null){if(!db.clientes.length){alert('Cadastre um cliente primeiro.');return}let s=source||{};modal(kind==='orcamentos'?'Novo orçamento':'Nova ordem de serviço',select('Cliente *','cliente',opts(db.clientes),s.cliente)+select('Serviço','servico',opts(db.servicos),s.servico)+field('Endereço do atendimento','endereco','text',s.endereco||'')+field('Data prevista / emissão','data','date',s.data||date())+field('Quantidade prevista','quantidade','number',s.quantidade||'','min="0" step="0.01"')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']],s.unidade)+field('Valor unitário (R$)','valor','number',s.valor||'','min="0" step="0.01"')+field('Observações','obs','text',s.obs||'')+(kind==='ordens'?select('Veículo','veiculo',opts(db.veiculos)):''),v=>{if(!v.cliente){alert('Selecione um cliente.');return}db[kind].push({...v,id:id(),numero:db[kind].length+1,status:kind==='orcamentos'?'Rascunho':'Aberta',origem:source?.id||''})})}function statusChange(k,i){let a=db[k][i], choices=k==='orcamentos'?['Rascunho','Enviado','Aprovado','Recusado','Vencido','Cancelado']:['Aberta','Agendada','Em execução','Concluída','Cancelada','Não executada'];modal('Atualizar situação',select('Situação','status',choices.map(x=>[x,x]),a.status)+field('Volume executado (m³)','volume','number',a.volume||'','min="0" step="0.01"')+field('Observações da execução','execucao','text',a.execucao||''),v=>Object.assign(a,v))}function convert(i){let o=db.orcamentos[i];if(o.status!=='Aprovado'){alert('Marque o orçamento como aprovado primeiro.');return}addWork('ordens',o)}function payment(){if(!db.ordens.length){alert('Cadastre uma ordem de serviço primeiro.');return}modal('Registrar pagamento',select('Ordem de serviço','ordem',[['','Selecione'],...db.ordens.map(x=>[x.id,`OS #${x.numero} — ${name('clientes',x.cliente)}`])])+field('Valor recebido (R$) *','valor','number','','required min="0.01" step="0.01"')+field('Data','data','date',date())+select('Forma de pagamento','forma',[['Pix','Pix'],['Dinheiro','Dinheiro'],['Transferência','Transferência'],['Cartão','Cartão'],['Outro','Outro']]),v=>{if(!v.ordem){alert('Selecione uma ordem.');return}db.pagamentos.push({...v,id:id(),numero:db.pagamentos.length+1})})}function receipt(i){let p=db.pagamentos[i],o=db.ordens.find(x=>x.id===p.ordem),c=db.clientes.find(x=>x.id===o?.cliente);let w=window.open('','_blank');if(!w){alert('Permita janelas para imprimir o recibo.');return}w.document.write(`<title>Recibo ${p.numero}</title><style>body{font:16px Arial;max-width:720px;margin:60px auto;line-height:1.8}h1{color:#263f93}small{color:#555}</style><h1>BIG JATTO</h1><p>Soluções Rápidas</p><hr><h2>RECIBO Nº ${p.numero}</h2><p>Recebemos de <b>${esc(c?.nome||'')}</b> a quantia de <b>${money(p.valor)}</b>, referente à ordem de serviço nº ${esc(o?.numero||'')}, por ${esc(p.forma)}, em ${esc(p.data)}.</p><br><p>____________________________________<br>Responsável pelo recebimento</p><small>Este recibo não substitui nota fiscal.</small><script>window.print()<\/script>`);w.document.close()}function render(){nav();let h='';if(current==='Painel'){let total=db.pagamentos.reduce((a,p)=>a+num(p.valor),0),pending=db.ordens.reduce((a,o)=>a+Math.max(0,num(o.quantidade)*num(o.valor)-db.pagamentos.filter(p=>p.ordem===o.id).reduce((s,p)=>s+num(p.valor),0)),0);h=head('Visão geral','Acompanhe seus atendimentos em um só lugar.','+ Nova ordem',"addWork('ordens')")+`<div class="cards">${[['Ordens em aberto',db.ordens.filter(x=>!['Concluída','Cancelada','Não executada'].includes(x.status)).length],['Orçamentos',db.orcamentos.length],['Recebido',money(total)],['Saldo estimado',money(pending)]].map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong><span>Todos os registros</span></div>`).join('')}</div><div class="panel"><div class="panelhead"><div><h2>Comece por aqui</h2><p>Organize o próximo atendimento da sua empresa.</p></div></div><div class="feature"><span class="icon">01</span><div><b>Cadastre seus clientes</b><div class="muted">Reúna contatos e endereços em um lugar.</div></div></div><div class="feature"><span class="icon">02</span><div><b>Prepare um orçamento</b><div class="muted">Informe o serviço, a quantidade e o preço.</div></div></div><div class="feature"><span class="icon">03</span><div><b>Registre a execução</b><div class="muted">Acompanhe a ordem e registre o recebimento.</div></div></div></div>`}
else if(current==='Clientes')h=head(current,'Seus contatos e locais de atendimento.','+ Novo cliente','addClient()')+table(['Cliente','CPF / CNPJ','Telefone','Endereço'],db.clientes.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.documento)}</td><td>${esc(x.telefone)}</td><td>${esc(x.endereco)} ${esc(x.cidade)}</td></tr>`));else if(current==='Serviços')h=head(current,'Tipos de serviços e unidades de cobrança.','+ Novo serviço','addService()')+table(['Serviço','Unidade','Valor de referência'],db.servicos.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.unidade)}</td><td>${x.valor?money(x.valor):'—'}</td></tr>`));else if(current==='Veículos')h=head(current,'Veículos utilizados nos atendimentos.','+ Novo veículo','addVehicle()')+table(['Identificação','Placa','Modelo','Capacidade'],db.veiculos.map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.placa)}</td><td>${esc(x.modelo)}</td><td>${esc(x.capacidade)} m³</td></tr>`));else if(['Orçamentos','Ordens de serviço'].includes(current)){let k=current==='Orçamentos'?'orcamentos':'ordens';h=head(current,'Acompanhe e atualize seus atendimentos.',k==='ordens'?'+ Nova ordem':'+ Novo orçamento',`addWork('${k}')`)+table(['Número','Cliente','Serviço','Data','Valor previsto','Situação','Ações'],db[k].map((x,i)=>`<tr><td>#${x.numero}</td><td>${name('clientes',x.cliente)}</td><td>${name('servicos',x.servico)}</td><td>${esc(x.data)}</td><td>${money(num(x.quantidade)*num(x.valor))}</td><td><span class="badge">${esc(x.status)}</span></td><td><button class="secondary" onclick="statusChange('${k}',${i})">Atualizar</button>${k==='orcamentos'?`<button class="secondary" onclick="convert(${i})">Gerar OS</button>`:''}</td></tr>`))}else if(current==='Pagamentos e recibos')h=head(current,'Registre recebimentos e imprima recibos.','+ Pagamento','payment()')+table(['Recibo','Ordem','Data','Forma','Valor','Ação'],db.pagamentos.map((x,i)=>`<tr><td>#${x.numero}</td><td>OS #${esc((db.ordens.find(o=>o.id===x.ordem)||{}).numero)}</td><td>${esc(x.data)}</td><td>${esc(x.forma)}</td><td>${money(x.valor)}</td><td><button class="secondary" onclick="receipt(${i})">Imprimir recibo</button></td></tr>`));else if(current==='Relatórios')h=head(current,'Resumo dos registros desta demonstração.','Imprimir','window.print()')+`<div class="cards">${[['Clientes',db.clientes.length],['Ordens concluídas',db.ordens.filter(x=>x.status==='Concluída').length],['Volume registrado',db.ordens.reduce((a,x)=>a+num(x.volume),0)+' m³'],['Total recebido',money(db.pagamentos.reduce((a,x)=>a+num(x.valor),0))]].map(x=>`<div class="card"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="panel"><h2>Resumo de ordens</h2><p>Os valores são os previstos na ordem. O volume registrado não altera automaticamente o preço nesta versão.</p></div>`;else if(current==='Usuários')h=head(current,'Acesso da equipe e permissões.')+'<div class="panel"><h2>Recurso em desenvolvimento</h2><p>O cadastro de usuários, as senhas e as permissões por perfil ainda não estão disponíveis nesta demonstração.</p></div>';else h=head(current,'Informações da sua empresa.','Editar dados','company()')+`<div class="panel"><h2>${esc(db.empresa.nome)}</h2><p>CNPJ: ${esc(db.empresa.cnpj||'Não informado')}<br>Telefone: ${esc(db.empresa.telefone||'Não informado')}<br>Endereço: ${esc(db.empresa.endereco||'Não informado')}</p></div>`;document.getElementById('app').innerHTML=h}function company(){let e=db.empresa;modal('Dados da empresa',field('Nome','nome','text',e.nome)+field('CNPJ','cnpj','text',e.cnpj||'')+field('Telefone','telefone','text',e.telefone||'')+field('Endereço','endereco','text',e.endereco||''),v=>db.empresa=v)}render();
</script></body></html>
