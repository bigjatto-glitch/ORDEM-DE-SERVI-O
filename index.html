</style></head><body><aside><img src="logo.jpeg" alt="Big Jatto Soluções Rápidas"><small>GESTÃO DE SERVIÇOS</small><nav id="nav"></nav><small>BIG JATTO • DEMONSTRAÇÃO<br>VERSÃO 28.10 — DADOS DA EMPRESA NO CABEÇALHO</small></aside><main><div id="app"></div></main><dialog id="dlg"><div class="modal" id="modal"></div></dialog><script>
const sections=['Painel','Agenda','Clientes','Colaboradores','Equipes','Serviços','Veículos','Orçamentos','Ordens de serviço','Pagamentos e recibos','Relatórios','Usuários','Configurações'];let current='Painel';let db=JSON.parse(localStorage.getItem('bj-demo-v1')||'null')||{clientes:[],servicos:[{nome:'Limpeza de fossa séptica',unidade:'m³'},{nome:'Esgotamento de fossa',unidade:'m³'},{nome:'Limpeza de caixa de gordura',unidade:'serviço'}],veiculos:[],orcamentos:[],ordens:[],pagamentos:[],empresa:{nome:'Big Jatto — Soluções Rápidas'}};db.operadores ||= []; db.servicos.forEach((x,i)=>{if(!x.id)x.id='servico-'+i}); let sessao=null; const save=()=>localStorage.setItem('bj-demo-v1',JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=n=>Number(n||0);const date=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);const name=(list,id)=>esc((db[list].find(x=>x.id===id)||{}).nome||'—');const field=(label,key,type='text',val='',extra='')=>`<label>${label}<input name="${key}" type="${type}" value="${esc(val)}" ${extra}></label>`;const select=(label,key,opts,val='')=>`<label>${label}<select name="${key}">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;const opts=(arr)=>[['','Selecione'],...arr.map(x=>[x.id,x.nome])];function modal(title,body,callback){document.getElementById('modal').innerHTML=`<h2>${title}</h2><form id="form"><div class="grid" style="margin-top:20px">${body}</div><div class="actions"><button type="button" class="secondary" onclick="dlg.close()">Cancelar</button><button>Salvar</button></div></form>`;dlg.showModal();const form=document.getElementById('form');const amount=form.elements.quantidade||form.elements.volume;const unit=form.elements.valor||form.elements.valorExec;const total=form.elements.totalFinal;const calc=form.querySelector('#calcTotal');function recalc(){if(!amount||!unit)return;let v=Math.round((Number(amount.value)||0)*(Number(unit.value)||0)*100)/100;if(calc)calc.textContent=money(v);if(total)total.value=v.toFixed(2)}if(amount&&unit){amount.addEventListener('input',recalc);unit.addEventListener('input',recalc);if(calc)recalc()}if(form.elements.cliente&&form.elements.endereco){form.elements.cliente.addEventListener('change',()=>{let c=db.clientes.find(x=>x.id===form.elements.cliente.value);form.elements.endereco.value=enderecoCliente(c)})}document.getElementById('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)));save();dlg.close();render()}}function nav(){document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${x===current?'active':''}" onclick="go(${i})">${['◈','♙','◇','▣','▤','☷','◉','▥','♙','⚙'][i]} &nbsp; ${x}</button>`).join('')}function go(i){current=sections[i];render()}function head(title,sub,button='',act=''){return `<div class="top"><div><div class="eyebrow">Big Jatto / ${esc(title)}</div><h1>${esc(title)}</h1><p>${sub}</p></div>${button?`<button onclick="${act}">${button}</button>`:''}</div><div class="notice"><b>DEMONSTRAÇÃO SEM SEGURANÇA REAL.</b> Usuários, senhas e dados ficam somente neste navegador e podem ser acessados ou alterados. Não há sincronização nem backup. Use apenas dados fictícios.</div>`}function table(headers,rows){return `<div class="panel tablewrap">${rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<div class="empty">Nenhum registro por enquanto.<br>Use o botão acima para começar.</div>'}</div>`}function enderecoCliente(c){if(!c)return '';if(!c.rua&&c.ruaNumero)return [c.ruaNumero,c.bairro,c.cidade,c.uf,c.cep].filter(Boolean).jo function formularioCliente(i){let c=i===undefined?{}:db.clientes[i];let corpo=field('Nome ou razão social *','nome','text',c.nome||'','required')+select('Pessoa','tipo',[['PF','Pessoa física — PF'],['PJ','Pessoa jurídica — PJ']],c.tipo||'PF')+field('CPF ou CNPJ','documento','text',c.documento||'')+field('Telefone / WhatsApp','telefone','text',c.telefone||'')+field('E-mail','email','email',c.email||'')+field('CEP','cep','text',c.cep||'','placeholder="00000-000" maxlength="9"')+`<div style="align-self:end"><button type="button" class="secondary" onclick="buscarCep()">Buscar endereço pelo CEP</button></div>`+field('Rua / logradouro','rua','text',c.rua||c.ruaNumero||c.endereco||'')+field('Número','numero','text',c.rua?c.numero||'':'')+field('Complemento','complemento','text',c.complemento||'')+field('Bairro','bairro','text',c.bairro||'')+field('Cidade','cidade','text',c.cidade||'')+field('Estado (UF)','uf','text',c.uf||'','maxlength="2"')+`<div style="grid-column:1/-1"><button type="button" class="secondary" onclick="buscarEndereco()">Pesquisar CEP pelo endereço</button><p class="muted">Para pesquisar o CEP, informe estado, cidade e parte do nome da rua. Confira o resultado e preencha o número.</p><div id="cepResultado" role="status"></div></div>`;modal(i===undefined?'Novo cliente':'Editar cliente',corpo,v=>{if(!isManager())return false;v.endereco=[v.rua,v.numero,v.complemento,v.bairro,v.cidade,v.uf,v.cep].filter(Boolean).join(', ');if(i===undefined)db.clientes.push({...v,id:id()});else Object.assign(db.clientes[i],v)})}

async function buscarCep(){const form=document.getElementById('form'),cep=form.elements.cep.value.replace(/\D/g,'');if(!/^\d{8}$/.test(cep)){alert('Informe um CEP com 8 dígitos.');return}const result=document.getElementById('cepResultado');result.textContent='Consultando CEP...';try{let response=await fetch('https://viacep.com.br/ws/'+cep+'/json/');if(!response.ok)throw Error('consulta');let data=await response.json();if(!document.contains(form))return;if(data.erro){result.textContent='CEP não encontrado. Confira os dados ou preencha o endereço manualmente.';return}if(form.elements.cep.value.replace(/\D/g,'')!==cep){result.textContent='O CEP mudou durante a consulta. Consulte novamente.';return}form.elements.cep.value=data.cep||cep;for(const [dest,src] of [['rua','logradouro'],['bairro','bairro'],['cidade','localidade'],['uf','uf']])if(data[src])form.elements[dest].value=data[src];result.textContent='Endereço encontrado. Confira os dados e informe o número e complemento.'}catch(e){if(document.contains(form))result.textContent='Não foi possível consultar o CEP. Verifique sua conexão ou preencha manualmente.'}}
async function buscarEndereco(){let f=document.getElementById('form'),uf=f.elements.uf.value.trim().toUpperCase(),cidade=f.elements.cidade.value.trim(),rua=f.elements.rua.value.trim(),el=document.getElementById('cepResultado');if(!/^[A-Z]{2}$/.test(uf)||cidade.length<3||rua.length<3){el.textContent='Informe UF com 2 letras e cidade e rua com pelo menos 3 caracteres.';return}el.textContent='Pesquisando...';try{let response=await fetch('https://viacep.com.br/ws/'+[uf,cidade,rua].map(encodeURIComponent).join('/')+'/json/');if(!response.ok)throw Error('consulta');let data=await response.json();if(!document.contains(f))return;if(!Array.isArray(data)||!data.length){el.textContent='Nenhum CEP encontrado. Confira os dados ou preencha manualmente.';return}el.innerHTML='<p class="muted">Selecione o endereço correspondente:</p>'+data.map((x,i)=>`<button type="button" class="secondary" data-cep-index="${i}" style="margin:3px">${esc(x.cep)} — ${esc(x.logradouro)} • ${esc(x.bairro)} • ${esc(x.localidade)}/${esc(x.uf)}</button>`).join('');el.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{let x=data[Number(btn.dataset.cepIndex)];f.elements.cep.value=x.cep||'';f.elements.rua.value=x.logradouro||rua;f.elements.bairro.value=x.bairro||'';f.elements.cidade.value=x.localidade||cidade;f.elements.uf.value=x.uf||uf;el.textContent='Endereço selecionado. Confira e informe o número e complemento.'})}catch(e){if(document.contains(f))el.textContent='Não foi possível pesquisar o CEP. Verifique sua conexão ou preencha manualmente.'}}
function addService(){if(!guardAdmin())return;modal('Novo serviço',field('Nome do serviço *','nome','text','','required')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']])+field('Valor de referência (R$)','valor','number','','step="0.01" min="0"'),v=>db.servicos.push({...v,id:id()}))}function addVehicle(){modal('Novo veículo',field('Identificação *','nome','text','','required')+field('Placa','placa')+field('Modelo','modelo')+field('Capacidade (m³)','capacidade','number','','step="0.01"'),v=>db.veiculos.push({...v,id:id()}))}function addWork(kind,source=null){if(!db.clientes.length){alert('Cadastre um cliente primeiro.');return}let s=source||{};modal(kind==='orcamentos'?'Novo orçamento':'Nova ordem de serviço',select('Cliente *','cliente',opts(db.clientes),s.cliente)+select('Serviço','servico',opts(db.servicos),s.servico)+field('Endereço do atendimento','endereco','text',s.endereco||'')+field('Data prevista / emissão','data','date',s.data||date())+field('Quantidade prevista','quantidade','number',s.quantidade||'','min="0" step="0.01"')+select('Unidade','unidade',[['m³','m³'],['serviço','Serviço'],['viagem','Viagem'],['hora','Hora']],s.unidade)+field('Valor unitário (R$)','valor','number',s.valor||'','min="0" step="0.01"')+`<div style="grid-column:1/-1;background:#edf4ff;padding:12px;border-radius:8px"><b>Total calculado: <span id="calcTotal">R$ 0,00</span></b><div class="muted">Quantidade × valor unitário</div></div>`+field('Observações','obs','text',s.obs||'')+(kind==='ordens'?select('Veículo','veiculo',opts(db.veiculos))+select('Encaminhar para operador','operador',opts(db.operadores.filter(x=>x.ativo!==false))):''),v=>{if(!v.cliente){alert('Selecione um cliente.');return}db[kind].push({...v,id:id(),numero:db[kind].length+1,status:kind==='orcamentos'?'Rascunho':'Aberta',origem:source?.id||''})})}function osLabel(o){if(o.numeroOficial)return o.numeroOficial;if(o.status==='Concluída')return 'Antiga #'+(o.numero||'—'); function moneyInWords(value){let n=Number(value);if(!Number.isFinite(n)||n<0||n>999999999999.99)throw Error('Valor fora do intervalo para escrita por extenso.');let cents=Math.round(n*100),whole=Math.floor(cents/100),fraction=cents%100;const units=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove'],teens=['dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],tens=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],hundreds=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];function group(v){if(v===100)return 'cem';let parts=[];if(v>=100){parts.push(hundreds[Math.floor(v/100)]);v%=100}if(v>=20){parts.push(tens[Math.floor(v/10)]);v%=10;if(v)parts.push(units[v])}else if(v>=10)parts.push(teens[v-10]);else if(v)parts.push(units[v]);return parts.join(' e ')}function integer(v){if(!v)return 'zero';let groups=[],index=0;while(v){let piece=v%1000;if(piece){let text=index===1&&piece===1?'mil':group(piece)+(index===1?' mil':index===2?(piece===1?' milhão':' milhões'):index===3?(piece===1?' bilhão':' bilhões'):'');groups.unshift({piece,text})}v=Math.floor(v/1000);index++}return groups.map((g,i)=>(i?(g.piece<100||g.piece%100===0?' e ':' '):'')+g.text).join('')}let result=whole?integer(whole)+(whole%1000000===0?' de reais':whole===1?' real':' reais'):'';if(fraction)result+=(result?' e ':'')+group(fraction)+(fraction===1?' centavo':' centavos');return result||'zero reais'}

function uppercaseEligible(el){return (el.tagName==='TEXTAREA'||el.tagName==='INPUT'&&el.type==='text')&&!['usuario','senha','email','linkAvaliacao','logo'].includes(el.name)}

function setupUppercase(form){function convert(el){if(!uppercaseEligible(el))return;let start=el.selectionStart,end=el.selectionEnd,old=el.value;el.value=old.toLocaleUpperCase('pt-BR');if(start!==null&&typeof el.setSelectionRange==='function')el.setSelectionRange(old.slice(0,start).toLocaleUpperCase('pt-BR').length,old.slice(0,end).toLocaleUpperCase('pt-BR').length)}form.addEventListener('input',e=>{if(!e.isComposing)convert(e.target)});form.addEventListener('compositionend',e=>convert(e.target));form.addEventListener('change',e=>convert(e.target))}


function driverTeam(){return sessao?.perfil==='motorista'?db.equipes.find(e=>e.motorista===sessao.colaborador):null}
function driverOrderForm(){const team=driverTeam();if(!team){alert('Seu usuário precisa estar vinculado a uma equipe com motorista e auxiliar. Solicite o cadastro ao administrador.');return}modal('Nova OS — serviço captado pelo motorista',`<p class="notice" style="grid-column:1/-1">Equipe: ${esc(team.nome)} — Motorista: ${name('colaboradores',team.motorista)} — Auxiliar: ${name('colaboradores',team.auxiliar)}. A OS será encaminhada automaticamente para esta equipe.</p>`+field('Nome / razão social do cliente *','nome','text','','required')+select('Pessoa','tipo',[['PF','Pessoa física — PF'],['PJ','Pessoa jurídica — PJ']],'PF')+field('CPF / CNPJ (opcional)','documento')+field('Telefone / WhatsApp','telefone','tel')+appointmentAddressInputs({})+field('Data do atendimento *','data','date',date(),'required')+field('Horário','hora','time')+select('Serviço *','servico',opts(db.servicos))+field('Quantidade prevista *','quantidade','number','','required min="0.01" step="0.01"')+select('Unidade','unidade',['m³','serviço','viagem','hora'].map(x=>[x,x]),'m³')+field('Valor unitário (R$) *','valor','number','','required min="0" step="0.01"')+'<div style="grid-column:1/-1">Total previsto: <b id="calcTotal"></b></div>'+select('Veículo','veiculo',opts(db.veiculos))+select('Forma de pagamento','forma',['Não informado','Pix','Dinheiro','Transferência','Cartão','Outro'].map(x=>[x,x]))+field('Observações','obs'),v=>createDriverOrder(v))}
function createDriverOrder(v){const team=driverTeam();if(!team)throw Error('Usuário sem equipe vinculada.');if(!v.nome?.trim()||!v.ruaNumero?.trim()||!v.data)throw Error('Informe nome, endereço e data.');if(!validDocument(v))throw Error('Confira o CPF / CNPJ.');if(!db.servicos.some(x=>x.id===v.servico))throw Error('Selecione um serviço válido.');if(!(num(v.quantidade)>0)||!Number.isFinite(Number(v.valor))||num(v.valor)<0||v.valor==='')throw Error('Confira quantidade e valor unitário.');if(v.veiculo&&!db.veiculos.some(x=>x.id===v.veiculo))throw Error('Selecione um veículo válido.');const address=completeAppointmentAddress(v),doc=String(v.documento||'').replace(/\D/g,''),existing=doc?db.clientes.find(c=>String(c.documento||'').replace(/\D/g,'')===doc):null;let client=existing||{id:id(),nome:v.nome.trim(),tipo:v.tipo,documento:v.documento||'',telefone:v.telefone||'',endereco:address,ruaNumero:v.ruaNumero,bairro:v.bairro||'',cidade:v.cidade||'',uf:v.uf||''};let order={id:id(),numero:db.ordens.length+1,cliente:client.id,clienteNome:v.nome.trim(),clienteTipo:v.tipo,clienteDocumento:v.documento||'',clienteTelefone:v.telefone||'',endereco:address,ruaNumero:v.ruaNumero,bairro:v.bairro||'',cidade:v.cidade||'',uf:v.uf||'',data:v.data,hora:v.hora||'',servico:v.servico,quantidade:v.quantidade,unidade:v.unidade||'m³',valor:v.valor,veiculo:v.veiculo||'',forma:v.forma||'Não informado',obs:v.obs||'',status:'Agendada',captadoPorMotorista:sessao.colaborador,criadoPorUsuario:sessao.id||'',origemContato:'Serviço captado pelo motorista',criadoEm:date()};assignTeam(order,team.id);let appointment={...order,id:id(),nome:order.clienteNome,tipo:order.clienteTipo,documento:order.clienteDocumento,telefone:order.clienteTelefone,ordemId:order.id,status:'OS gerada'};delete appointment.numero;order.agendaId=appointment.id;let lengths=[db.clientes.length,db.ordens.length,db.agenda.length];if(!existing)db.clientes.push(client);db.ordens.push(order);db.agenda.push(appointment);try{save()}catch(e){db.clientes.length=lengths[0];db.ordens.length=lengths[1];db.agenda.length=lengths[2];throw Error('Não foi possível salvar a OS neste navegador.')}return order}

let mediaBusy=false,mediaObjectUrls=[];
function mediaAllowed(o){return !!o&&(isManager()||forwarded(o))}
function mediaPanel(i){return `<section data-media-order="${i}" style="grid-column:1/-1;border:1px solid #dce3ed;border-radius:10px;padding:14px;margin:14px 0"><h3>Fotos e vídeos da execução</h3><div class="actions" style="justify-content:flex-start;flex-wrap:wrap"><button type="button" class="secondary" onclick="openStampedCamera(${i},'photo')">Tirar foto com identificação</button><button type="button" class="secondary" onclick="openStampedCamera(${i},'video')">Gravar vídeo com identificação</button></div><label>Ou selecionar fotos e vídeos da galeria<input type="file" accept="image/*,video/*" multiple onchange="uploadOrderMedia(${i},this)"></label><p class="muted">As capturas feitas aqui recebem data/hora do aparelho, endereço cadastrado na OS e logomarca. Arquivos da galeria permanecem originais. Permita câmera e, para vídeos com som, microfone. Até 50 MB por arquivo. Os anexos são salvos imediatamente, mesmo ao cancelar o formulário. Ficam somente neste navegador e aparelho; não integram o PDF da OS.</p><p data-media-status role="status"></p><div data-camera-box></div><div data-media-list style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))"></div></section>`}
function openMediaDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('Este navegador não permite armazenar os anexos.'));return}let req=indexedDB.open('bj-os-media-v1',1);req.onupgradeneeded=()=>{let store=req.result.createObjectStore('files',{keyPath:'id'});store.createIndex('orderId','orderId')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(Error('Não foi possível abrir o armazenamento de anexos.'));req.onblocked=()=>reject(Error('Feche outras abas do aplicativo e tente novamente.'))})}
async function mediaOperation(mode,run){let dbm=await openMediaDB();try{return await new Promise((resolve,reject)=>{let tx=dbm.transaction('files',mode),request=run(tx.objectStore('files'));tx.oncomplete=()=>resolve(request?.result);tx.onabort=tx.onerror=()=>reject(Error('Não foi possível salvar ou ler os anexos. Verifique o espaço disponível no aparelho.'))})}finally{dbm.close()}}
function mediaSection(i){return document.querySelector('[data-media-order="'+i+'"]')}
function clearMediaUrls(){for(let u of mediaObjectUrls)URL.revokeObjectURL(u);mediaObjectUrls=[]}
function initMediaPanels(form){const panels=form.querySelectorAll('[data-media-order]');if(panels.length){clearMediaUrls();for(let p of panels)renderOrderMedia(Number(p.dataset.mediaOrder));if(!dlg.dataset.mediaCleanup){dlg.addEventListener('close',()=>{closeStampedCamera();clearMediaUrls()});dlg.dataset.mediaCleanup='1'}}}
async function renderOrderMedia(i){let o=db.ordens[i],section=mediaSection(i);if(!section||!mediaAllowed(o))return;let list=section.querySelector('[data-media-list]'),status=section.querySelector('[data-media-status]');try{let files=await mediaOperation('readonly',store=>store.index('orderId').getAll(o.id));if(!section.isConnected||!mediaAllowed(o))return;list.replaceChildren();if(!files.length){list.textContent='Nenhuma foto ou vídeo anexado.';return}for(let f of files){const card=document.createElement('div'),preview=document.createElement(f.type.startsWith('video/')?'video':'img'),url=URL.createObjectURL(f.blob);mediaObjectUrls.push(url);preview.src=url;preview.style.cssText='width:100%;max-height:200px;object-fit:contain;background:#f3f5f8';if(f.type.startsWith('video/')){preview.controls=true;preview.preload='metadata';preview.playsInline=true}else preview.alt=f.name;const caption=document.createElement('p');caption.textContent=f.name+' • '+(f.size/1048576).toFixed(1)+' MB';const download=document.createElement('a');download.href=url;download.download=f.name;download.textContent='Baixar arquivo';download.className='btn secondary';const remove=document.createElement('button');remove.type='button';remove.className='secondary';remove.textContent='Remover';remove.addEventListener('click',()=>removeOrderMedia(i,f.id));card.append(preview,caption,download,remove);list.append(card)}}catch(e){status.textContent=e.message}}
async function uploadOrderMedia(i,input){let o=db.ordens[i];if(!mediaAllowed(o)||mediaBusy)return;let files=Array.from(input.files||[]);if(!files.length)return;let status=mediaSection(i).querySelector('[data-media-status]');if(files.some(f=>!(/^(image|video)\//.test(f.type))||f.size>50*1048576||f.size===0)){status.textContent='Selecione apenas fotos ou vídeos não vazios, de até 50 MB cada.';input.value='';return}mediaBusy=true;input.disabled=true;status.textContent='Salvando anexos…';let saved=0;try{for(let f of files){if(!mediaAllowed(o))throw Error('Acesso à OS encerrado.');await mediaOperation('readwrite',store=>store.put({id:id(),orderId:o.id,name:f.name,type:f.type,size:f.size,blob:f,createdAt:new Date().toISOString(),author:sessao?.colaborador||sessao?.id||sessao?.perfil}));saved++}status.textContent=saved+' arquivo(s) salvo(s) neste aparelho.'}catch(e){status.textContent=saved+' arquivo(s) salvo(s). '+e.message}finally{mediaBusy=false;input.disabled=false;input.value='';await renderOrderMedia(i)}}
async function removeOrderMedia(i,key){let o=db.ordens[i];if(!mediaAllowed(o)||mediaBusy||!confirm('Remover este anexo da OS?'))return;mediaBusy=true;try{let file=await mediaOperation('readonly',store=>store.get(key));if(!file||file.orderId!==o.id)throw Error('Anexo não encontrado nesta OS.');await mediaOperation('readwrite',store=>store.delete(key));await renderOrderMedia(i)}catch(e){alert(e.message)}finally{mediaBusy=false}}

let stampedCamera=null;
function cameraStampLines(o,now=new Date()){return [db.empresa.nome||'BIG JATTO','OS '+osLabel(o)+' | '+now.toLocaleString('pt-BR'), 'Endereço da OS: '+(o.endereco||'Não informado')]}
function stampWrap(ctx,text,width){let lines=[],line='';for(let word of String(text).split(/\s+/)){if(ctx.measureText(word).width>width){if(line){lines.push(line);line=''}for(let ch of word){if(ctx.measureText(line+ch).width>width){lines.push(line);line=''}line+=ch}}else if(line&&ctx.measureText(line+' '+word).width>width){lines.push(line);line=word}else line+=(line?' ':'')+word}if(line)lines.push(line);return lines}
function paintStampedFrame(camera){let {canvas,video,order,logo}=camera,c=canvas.getContext('2d'),w=canvas.width,h=canvas.height;c.drawImage(video,0,0,w,h);let font=Math.max(14,Math.round(w/48)),pad=Math.round(w*.025),logoW=Math.round(w*.16),textX=pad+logoW+pad,textWidth=w-textX-pad;c.font='600 '+font+'px Arial';let lines=cameraStampLines(order).flatMap(t=>stampWrap(c,t,textWidth)),lineH=Math.ceil(font*1.35),boxH=Math.max(logoW*.7+pad*2,lines.length*lineH+pad*2),top=h-boxH;c.fillStyle='rgba(0,0,0,0.78)';c.fillRect(0,top,w,boxH);if(logo){let maxH=boxH-pad*2,scale=Math.min(logoW/logo.width,maxH/logo.height);c.fillStyle='#fff';c.fillRect(pad,top+pad,logoW,maxH);c.drawImage(logo,pad+(logoW-logo.width*scale)/2,top+pad+(maxH-logo.height*scale)/2,logo.width*scale,logo.height*scale)}c.fillStyle='#fff';c.textBaseline='top';lines.forEach((t,i)=>c.fillText(t,textX,top+pad+i*lineH))}
async function openStampedCamera(i,mode){let order=db.ordens[i];if(!mediaAllowed(order)||mediaBusy)return;if(stampedCamera)closeStampedCamera();const section=mediaSection(i),status=section.querySelector('[data-media-status]'),box=section.querySelector('[data-camera-box]');if(!navigator.mediaDevices?.getUserMedia){status.textContent='Câmera indisponível. Abra o aplicativo por HTTPS em um navegador compatível.';return}if(mode==='video'&&(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)){status.textContent='Este navegador não oferece gravação de vídeo com identificação. Use outro navegador ou tire uma foto.';return}box.innerHTML='<p>Preparando câmera…</p>';const cam={i,order,mode,box,status,stream:null,output:null,raf:null,timer:null,recorder:null,pending:null,closed:false};stampedCamera=cam;try{const logo=await documentImage(logoSource());if(!logo)throw Error('Não foi possível carregar a logomarca. Confira as Configurações.');cam.logo=logo;if(cam.closed)return;cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:mode==='video'});if(cam.closed){cam.stream.getTracks().forEach(t=>t.stop());return}cam.video=document.createElement('video');cam.video.muted=true;cam.video.autoplay=true;cam.video.playsInline=true;cam.video.srcObject=cam.stream;await cam.video.play();if(cam.closed)return;let vw=cam.video.videoWidth||1280,vh=cam.video.videoHeight||720,scale=Math.min(1,1280/Math.max(vw,vh));cam.canvas=document.createElement('canvas');cam.canvas.width=Math.round(vw*scale);cam.canvas.height=Math.round(vh*scale);cam.canvas.style.cssText='width:100%;max-height:65vh;object-fit:contain;background:black';box.replaceChildren(cam.canvas);let controls=document.createElement('div');controls.className='actions';cam.capture=document.createElement('button');cam.capture.type='button';cam.capture.textContent=mode==='photo'?'Capturar e salvar foto':'Iniciar gravação';cam.capture.onclick=()=>mode==='photo'?captureStampedPhoto(cam):startStampedVideo(cam);cam.stop=document.createElement('button');cam.stop.type='button';cam.stop.textContent='Parar e salvar vídeo';cam.stop.hidden=true;cam.stop.onclick=()=>stopStampedVideo(cam);let close=document.createElement('button');close.type='button';close.className='secondary';close.textContent='Fechar câmera';close.onclick=()=>{closeStampedCamera();box.replaceChildren()};controls.append(cam.capture,cam.stop,close);box.append(controls);cam.retry=document.createElement('button');cam.retry.type='button';cam.retry.textContent='Tentar salvar novamente';cam.retry.hidden=true;cam.retry.onclick=()=>saveStampedBlob(cam,cam.pending);cam.download=document.createElement('a');cam.download.className='btn secondary';cam.download.textContent='Baixar captura';cam.download.hidden=true;box.append(cam.retry,cam.download);function draw(){if(cam.closed)return;paintStampedFrame(cam);cam.raf=requestAnimationFrame(draw)}draw();status.textContent=mode==='photo'?'Confira a identificação na prévia e capture a foto.':'Vídeos com som: até 3 minutos ou 45 MB. Mantenha esta tela aberta durante a gravação.'}catch(e){if(cam.stream)cam.stream.getTracks().forEach(t=>t.stop());if(stampedCamera===cam)stampedCamera=null;box.replaceChildren();status.textContent='Não foi possível abrir a câmera: '+(e.name==='NotAllowedError'?'permita câmera e microfone no navegador.':e.message)}}
async function saveStampedBlob(cam,blob){if(!blob||!blob.size)return;mediaBusy=true;cam.status.textContent='Salvando captura na OS…';cam.pending=blob;let ext=blob.type.startsWith('image/')?'jpg':blob.type.includes('mp4')?'mp4':'webm',filename='OS-'+osLabel(cam.order).replace(/[^a-z0-9_-]/gi,'-')+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+ext;try{if(!mediaAllowed(cam.order))throw Error('Você não tem acesso a esta OS.');await mediaOperation('readwrite',store=>store.put({id:id(),orderId:cam.order.id,name:filename,type:blob.type,size:blob.size,blob,createdAt:new Date().toISOString(),watermarked:true,stampAddress:cam.order.endereco||'',author:sessao?.colaborador||sessao?.id||sessao?.perfil}));cam.pending=null;if(cam.retry)cam.retry.hidden=true;cam.status.textContent='Captura com identificação salva e vinculada à OS.';await renderOrderMedia(cam.i)}catch(e){cam.status.textContent='Não foi possível salvar: '+e.message+'. Baixe a captura antes de fechar a câmera.';if(cam.retry)cam.retry.hidden=false}finally{if(cam.download){if(cam.downloadUrl)URL.revokeObjectURL(cam.downloadUrl);cam.downloadUrl=URL.createObjectURL(blob);mediaObjectUrls.push(cam.downloadUrl);cam.download.href=cam.downloadUrl;cam.download.download=filename;cam.download.hidden=false}mediaBusy=false}}
async function captureStampedPhoto(cam){if(cam.closed||mediaBusy)return;if(cam.pending){cam.status.textContent='Salve novamente ou baixe a captura pendente antes de tirar outra foto.';return;}cam.capture.disabled=true;mediaBusy=true;try{paintStampedFrame(cam);let blob=await new Promise(resolve=>cam.canvas.toBlob(resolve,'image/jpeg',.92));if(!blob)throw Error('Falha ao gerar imagem.');await saveStampedBlob(cam,blob)}catch(e){cam.status.textContent=e.message}finally{mediaBusy=false;cam.capture.disabled=false}}
function startStampedVideo(cam){if(cam.closed||mediaBusy)return;if(cam.pending){cam.status.textContent='Salve novamente ou baixe a captura pendente antes de gravar outro vídeo.';return;}try{cam.output=cam.canvas.captureStream(25);for(let track of cam.stream.getAudioTracks())cam.output.addTrack(track);let type=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));cam.recorder=new MediaRecorder(cam.output,{...(type?{mimeType:type}:{}),videoBitsPerSecond:2500000});let chunks=[],size=0;cam.recorder.ondataavailable=e=>{if(e.data.size){chunks.push(e.data);size+=e.data.size;if(size>=45*1048576)stopStampedVideo(cam)}};cam.recorder.onstop=async()=>{clearTimeout(cam.timer);const blob=new Blob(chunks,{type:cam.recorder.mimeType||type||'video/webm'});cam.stop.hidden=true;cam.capture.disabled=false;mediaBusy=false;await saveStampedBlob(cam,blob);if(cam.output)cam.output.getVideoTracks().forEach(t=>t.stop())};cam.recorder.onerror=()=>{cam.status.textContent='Falha na gravação. Tente novamente.';stopStampedVideo(cam)};cam.recorder.start(1000);mediaBusy=true;cam.capture.disabled=true;cam.stop.hidden=false;cam.timer=setTimeout(()=>stopStampedVideo(cam),180000);cam.status.textContent='Gravando com identificação e áudio. Toque em Parar e salvar vídeo ao terminar.'}catch(e){mediaBusy=false;if(cam.output)cam.output.getVideoTracks().forEach(t=>t.stop());cam.status.textContent='Não foi possível gravar neste navegador: '+e.message}}
function stopStampedVideo(cam){if(cam.recorder?.state==='recording'){cam.status.textContent='Finalizando vídeo…';cam.recorder.stop()}}
function closeStampedCamera(){let cam=stampedCamera;if(!cam)return;cam.closed=true;cancelAnimationFrame(cam.raf);clearTimeout(cam.timer);stopStampedVideo(cam);cam.stream?.getTracks().forEach(t=>t.stop());if(cam.recorder?.state!=='inactive'&&cam.output)cam.output.getVideoTracks().forEach(t=>t.stop());if(cam.video)cam.video.srcObject=null;stampedCamera=null}
</script></body></html>
